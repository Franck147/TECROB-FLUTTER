name: tecrobsys
description: "TecrobSys - Sistema de Gestión de Taller Técnico"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Backend & Autenticación
  supabase_flutter: ^2.8.0

  # Gestión de Estado
  flutter_riverpod: ^2.5.1

  # Peticiones HTTP (API DNI)
  dio: ^5.4.3+1
  http: ^1.2.1

  # Generación e Impresión de PDF
  pdf: ^3.10.8
  printing: ^5.12.0

  # Compartir archivos y URLs
  share_plus: ^9.0.0
  path_provider: ^2.1.3
  url_launcher: ^6.3.0

  # Formato de fechas y moneda
  intl: ^0.19.0

  # Tipografía y UI
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  path_provider_android: 2.2.17

flutter:
  uses-material-design: true
